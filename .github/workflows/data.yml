name: Refresh scanner data
on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/data.yml
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
        env:
          ORCA_KEY: ${{ secrets.ORCA_KEY }}
      - name: Commit data
        run: |
          git config user.name "scanner-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Refresh scanner data" && git pull --rebase -X theirs -q && git push; fi
