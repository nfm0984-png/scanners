name: veterans-scan

on:
  schedule:
    # UTC. About 9:03 AM, 11:33 AM, 2:33 PM and 5:33 PM Pacific (winter time).
    # In summer (PDT) shift each hour earlier by one: 16, 18, 21, 0.
    - cron: "3 17 * * *"
    - cron: "33 19 * * *"
    - cron: "33 22 * * *"
    - cron: "33 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veterans-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan Kalshi veterans
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TOP_N: "50"
          MAX_VETS: "15"
          VET_MIN_USD: "500"
          FOLLOW: "BWmarkets,iluminado,Ryqeux,bama0037,past.grass,nettinyahoo"
        run: python veterans_scan.py

      - name: Save data for the website
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add veterans_state.json veterans-data.json
          git diff --staged --quiet || git commit -m "update veterans data"
          git push
