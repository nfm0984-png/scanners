<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2540">
<meta name="robots" content="noindex">
<title>Whale Scanner</title>
<style>
:root{--ink:#0B1F33;--mut:#4B6478;--a:#0891B2;--a2:#0E7490;--bg:#ECF6FB;--card:#fff;--line:#CFE3EE;--good:#15803D;--goodbg:#DCFCE7;--bad:#B91C1C;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0B2540;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.col{max-width:660px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:40px}
.tabs{position:sticky;top:0;z-index:5;background:rgba(236,246,251,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pill{flex:none;background:#E0F0F8;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:800;color:#1E3A5F;min-height:44px}
.pill.on{background:var(--a);border-color:var(--a);color:#fff}
.in{padding:16px 14px}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.6px;line-height:1.1}
.sub{color:var(--mut);margin:0 0 12px}
.hero{background:linear-gradient(135deg,#0B3A6B,#0891B2 60%,#14B8A6 120%);color:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 30px rgba(8,145,178,.28)}
.hero small{letter-spacing:.14em;font-weight:900;font-size:12.5px}
.hero h2{margin:8px 0 4px;font-size:25px;line-height:1.12}
.hb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.hb button{border-radius:16px;padding:14px 8px;font-weight:850;font-size:17px;min-height:54px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff}
.hb button.p{background:#fff;color:var(--a2);border-color:#fff}
.hb button:disabled{opacity:.6}
.st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st div{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 14px}
.st b{display:block;font-size:26px;line-height:1.1}.st span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.fl{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.fc{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:800;color:#1E3A5F;min-height:42px}
.fc.on{background:var(--a2);border-color:var(--a2);color:#fff}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(8,145,178,.08)}
.meta{font-size:13.5px;color:var(--mut);font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ttl{font-size:21px;font-weight:900;line-height:1.2;margin:6px 0 2px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tag{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;background:#E3F1F8;color:#1E3A5F}
.tag.d{background:var(--a2);color:#fff;font-size:15px}.tag.g{background:var(--goodbg);color:var(--good)}
a{color:var(--a2);font-weight:800}
.empty{text-align:center;color:var(--mut);padding:28px 14px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.err{background:#FEE2E2;color:var(--bad);border-radius:14px;padding:12px 14px;font-weight:700;margin:10px 0;overflow-wrap:anywhere}
label{display:block;font-weight:800;margin:14px 0 4px}
input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:16px}
.b1{background:var(--a);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:850;margin-top:12px}
.b2{background:none;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:800;margin:12px 0 0 8px}
pre{background:#0B2540;color:#BFE6F5;border-radius:14px;padding:12px;font-size:12px;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-all}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row span:last-child{font-weight:800;text-align:right}
</style>
</head>
<body>
<div class="col">
<div class="tabs" id="tabs">
  <button class="pill on" data-t="feed">Whale feed</button>
  <button class="pill" data-t="board">Leaderboard</button>
  <button class="pill" data-t="set">Settings</button>
</div>
<div class="in">
  <h1>Whale Scanner</h1>
  <p class="sub">Polymarket smart-money trades, straight from the Orca API.</p>
  <div class="hero">
    <small>ORCA · LIVE FEED</small>
    <h2>Big wallets. Fresh trades. No hedges.</h2>
    <div id="status" style="opacity:.95">Not loaded yet</div>
    <div class="hb"><button class="p" id="go">⚡ Scan</button><button id="auto">Auto: off</button></div>
    <div class="st">
      <div><b id="s1">0</b><span>Positions</span></div>
      <div><b id="s2">0</b><span>Total money</span></div>
      <div><b id="s3">0</b><span>Hedges hidden</span></div>
      <div><b id="s4">—</b><span>Biggest</span></div>
    </div>
  </div>
  <div id="main"></div>
</div>
</div>

<script>
var BASE="https://orcalayer.com";
var PATHS=["/api/v2/whales/alerts","/api/v2/whale-alerts","/api/v2/alerts","/api/public/v1/whales/alerts"];
var SPORT=[" vs "," vs. ","nfl","nba","ncaa","mlb","nhl","epl","ufc","spread","moneyline","o/u","over/under","premier league","champions league","world cup","tennis","grand prix","playoff","mvp"];
var S={t:"feed",min:1000,mins:60,sports:true,maxpx:0.97,auto:false,rows:[],hedged:0,raw:"",err:"",board:[],boardErr:""},timer=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return""}}
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(n){n=+n||0;if(n>=1e6)return"$"+(n/1e6).toFixed(2)+"M";if(n>=1000)return"$"+(n/1000).toFixed(1).replace(/\.0$/,"")+"k";return"$"+Math.round(n)}
function pick(o){for(var i=1;i<arguments.length;i++){var v=o[arguments[i]];if(v!==undefined&&v!==null&&v!=="")return v}return null}
function rowsOf(j){if(Array.isArray(j))return j;if(j&&typeof j==="object"){var ks=["alerts","data","items","results","trades","leaderboard","whales"];for(var i=0;i<ks.length;i++)if(Array.isArray(j[ks[i]]))return j[ks[i]];for(var k in j)if(Array.isArray(j[k]))return j[k]}return[]}
function map(r){var wr=parseFloat(pick(r,"win_rate","winRate","wallet_win_rate"));if(wr&&wr<=1)wr*=100;
 var ts=pick(r,"timestamp","time","created_at","ts");var t=ts?(isNaN(+ts)?Date.parse(ts)/1000:(+ts>1e11?+ts/1000:+ts)):0;
 var w=String(pick(r,"wallet","address","proxyWallet")||"");
 return{who:pick(r,"name","username","pseudonym","label")||(w?w.slice(0,8):"whale"),wallet:w,market:String(pick(r,"market","title","question","market_title")||"Unknown market"),
 outcome:String(pick(r,"outcome","outcome_name")||""),side:String(pick(r,"side","action")||"BUY").toUpperCase(),usd:parseFloat(pick(r,"usd","usd_size","size_usd","amount_usd","notional","value"))||0,
 price:parseFloat(pick(r,"price","avg_price","entry_price"))||0,wr:wr||null,pnl:parseFloat(pick(r,"pnl","total_pnl","lifetime_pnl"))||null,slug:pick(r,"slug","event_slug","market_slug")||"",cat:String(pick(r,"category","tag")||"").toLowerCase(),t:t}}
function sports(a){if(a.cat==="sports")return true;var x=" "+a.market.toLowerCase()+" ";return SPORT.some(function(w){return x.indexOf(w)>=0})}
function build(raw){var A=raw.map(map),both={};
 A.forEach(function(a){if(a.side==="BUY"){var k=a.wallet+"|"+a.market;(both[k]=both[k]||{})[a.outcome]=1}});
 var hid={},n=0;for(var k in both)if(Object.keys(both[k]).length>1){hid[k]=1;n++}
 var g={};A.forEach(function(a){if(a.side!=="BUY"&&a.side!=="SELL")return;if(hid[a.wallet+"|"+a.market])return;if(S.sports&&!sports(a))return;
  var key=a.wallet+"|"+a.market+"|"+a.outcome+"|"+a.side,x=g[key];if(!x){x=g[key]={a:a,usd:0,pxw:0,n:0,t:0}}x.usd+=a.usd;x.pxw+=a.price*a.usd;x.n++;x.t=Math.max(x.t,a.t)});
 S.hedged=n;return Object.keys(g).map(function(k){var x=g[k];x.px=x.usd?x.pxw/x.usd:x.a.price;return x}).filter(function(x){return x.usd>=S.min&&!(x.a.side==="BUY"&&x.px>S.maxpx)}).sort(function(a,b){return b.usd-a.usd})}
function ago(t){if(!t)return"";var m=Math.max(0,Math.round((Date.now()/1000-t)/60));return m<60?m+"m ago":Math.round(m/60)+"h ago"}
function fc(v,l,on,k){return'<button class="fc'+(on?" on":"")+'" data-'+k+'="'+v+'">'+l+'</button>'}
function feed(){var R=S.rows,h='';
 h+='<div class="fl">'+[[500,"$500+"],[1000,"$1k+"],[5000,"$5k+"],[10000,"$10k+"]].map(function(x){return fc(x[0],x[1],S.min==x[0],"min")}).join("")+fc("s",S.sports?"Sports only":"All markets",S.sports,"sp")+'</div><div class="fl" style="padding-top:0">'+[[15,"15m"],[60,"1h"],[180,"3h"],[720,"12h"]].map(function(x){return fc(x[0],"Last "+x[1],S.mins==x[0],"mins")}).join("")+'</div>';
 if(S.err)h+='<div class="err">'+e(S.err)+'</div>';
 if(!R.length&&!S.err)h+='<div class="card empty"><b>No positions to show</b>Tap Scan, or lower the minimum size. Add your key in Settings first.</div>';
 R.forEach(function(x,i){var a=x.a,no=/^no$/i.test(a.outcome);
  h+='<div class="card"><div class="meta"><span>#'+(i+1)+'</span><span>'+e(a.who)+'</span>'+(x.t?'<span>'+ago(x.t)+'</span>':'')+'</div><div class="ttl">'+e(a.market)+'</div><div style="color:var(--mut);font-weight:700">'+e(a.side)+' '+e(a.outcome)+' @ '+Math.round(x.px*100)+'¢ · '+x.n+' fill'+(x.n>1?"s":"")+'</div><div class="tags"><span class="tag d">'+$(x.usd)+'</span>'+(a.wr?'<span class="tag g">WR '+Math.round(a.wr)+'%</span>':'')+(a.pnl?'<span class="tag">PnL '+$(a.pnl)+'</span>':'')+(a.slug?'<a href="https://polymarket.com/event/'+e(a.slug)+'" target="_blank" rel="noopener" class="tag">Open ↗</a>':'')+'</div></div>'});
 return h}
function board(){var h='<div class="sub">Public leaderboard. No key needed.</div><button class="b1" id="lb">Load leaderboard</button>';
 if(S.boardErr)h+='<div class="err">'+e(S.boardErr)+'</div>';
 S.board.forEach(function(r,i){var w=map(r),p=pick(r,"pnl","total_pnl","profit"),wr=parseFloat(pick(r,"win_rate","winRate"));if(wr&&wr<=1)wr*=100;
  h+='<div class="card"><div class="meta"><span>#'+(pick(r,"rank")||i+1)+'</span></div><div class="ttl">'+e(w.who)+'</div><div class="tags">'+(p!=null?'<span class="tag d">'+$(p)+' PnL</span>':'')+(wr?'<span class="tag g">WR '+Math.round(wr)+'%</span>':'')+'</div></div>'});
 return h}
function settings(){var k=ls("orca_key");
 return'<h2 style="margin:0">Settings</h2><div class="card"><label>Orca API key</label><input id="key" type="password" placeholder="'+(k?"Saved in this browser":"Paste your key")+'" autocomplete="off"><button class="b1" id="sk">Save key</button>'+(k?'<button class="b2" id="ck">Remove key</button>':'')+'<p style="color:var(--mut);font-size:14px">Stored only in this browser. It is never put in the page or the repo. Use a fresh key, and don’t save it on a shared device.</p><label>Whale-alerts path (optional)</label><input id="path" value="'+e(ls("orca_path"))+'" placeholder="auto: tries several"><button class="b1" id="sp">Save path</button></div><div class="card"><b>Last raw response</b><pre>'+e(S.raw||"Nothing yet. Tap Scan.")+'</pre></div>'}
function draw(){var R=S.rows,tot=R.reduce(function(m,x){return m+x.usd},0),top=R.reduce(function(m,x){return Math.max(m,x.usd)},0);
 s1.textContent=R.length;s2.textContent=tot?$(tot):"0";s3.textContent=S.hedged;s4.textContent=top?$(top):"—";
 main.innerHTML=S.t==="feed"?feed():S.t==="board"?board():settings();
 [].forEach.call(tabs.children,function(b){b.className="pill"+(b.dataset.t===S.t?" on":"")});auto.textContent="Auto: "+(S.auto?"on":"off")}
var main=document.getElementById("main"),tabs=document.getElementById("tabs"),statusEl=document.getElementById("status"),go=document.getElementById("go"),auto=document.getElementById("auto");
var s1=document.getElementById("s1"),s2=document.getElementById("s2"),s3=document.getElementById("s3"),s4=document.getElementById("s4");
function get(path,key){var H={Accept:"application/json"};if(key)H["x-api-key"]=key;return fetch(BASE+path,{headers:H}).then(function(r){return r.text().then(function(t){if(!r.ok)throw{status:r.status,body:t};try{return JSON.parse(t)}catch(x){throw{status:r.status,body:t}}})})}
function scan(){var k=ls("orca_key");S.err="";if(!k){S.err="Add your Orca key in Settings first.";draw();return}
 go.disabled=true;go.textContent="Scanning…";var cand=ls("orca_path")?[ls("orca_path")]:PATHS,qs="?minutes="+S.mins+"&min_usd="+S.min,i=0;
 (function next(){if(i>=cand.length){S.err="Couldn’t load alerts. If it says Failed to fetch, the API may block browsers (CORS); then use the GitHub Actions version. Otherwise set the correct path in Settings.";fin();return}
  var p=cand[i++];get(p+qs,k).then(function(j){S.raw=p+"\n"+JSON.stringify(j,null,1).slice(0,2500);S.rows=build(rowsOf(j));statusEl.textContent="Updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+" · "+p;fin()}).catch(function(x){
   S.raw=p+" -> "+(x.status||"network error")+"\n"+(x.body?String(x.body).slice(0,600):String(x));
   if(x.status===401||x.status===403){S.err=(x.status===403?"Your plan isn’t Premium for this endpoint.":"Key rejected.")+" ("+x.status+")";fin()}else if(!x.status){S.err="Failed to fetch. The API may block browser requests (CORS), or you’re offline.";fin()}else next()})})();
 function fin(){go.disabled=false;go.textContent="⚡ Scan";draw()}}
tabs.onclick=function(ev){var b=ev.target.closest("button");if(b){S.t=b.dataset.t;draw()}};
main.onclick=function(ev){var b=ev.target.closest("button");if(!b)return;
 if(b.dataset.min){S.min=+b.dataset.min;S.rows=[];draw()}else if(b.dataset.mins){S.mins=+b.dataset.mins;draw()}else if(b.dataset.sp!==undefined){S.sports=!S.sports;draw()}
 else if(b.id==="sk"){var v=document.getElementById("key").value.trim();if(v){ls("orca_key",v);draw();statusEl.textContent="Key saved"}}
 else if(b.id==="ck"){ls("orca_key",null);draw()}
 else if(b.id==="sp"){ls("orca_path",document.getElementById("path").value.trim()||null);draw()}
 else if(b.id==="lb"){S.boardErr="";get("/api/public/v1/whales/leaderboard?limit=25").then(function(j){S.board=rowsOf(j);draw()}).catch(function(x){S.boardErr=x.status?"Error "+x.status:"Failed to fetch (browser may be blocked).";draw()})}};
go.onclick=scan;
auto.onclick=function(){S.auto=!S.auto;if(timer){clearInterval(timer);timer=null}if(S.auto){scan();timer=setInterval(function(){if(!document.hidden)scan()},60000)}draw()};
draw();
</script>
</body>
</html>
