<style>

.in{padding:16px 14px}

a{color:var(--a2);font-weight:800}

.hero{padding:14px 14px 12px;border-radius:22px}
.hero h2{font-size:21px;margin:6px 0 2px}

.st{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

.fl{flex-wrap:wrap;overflow:visible;gap:6px;padding:10px 0 2px}
.fc{padding:6px 12px;min-height:36px;font-size:14px}

.hero #status{grid-column:1;color:#9CC7AE;font-size:16px}
.hero .hb{grid-column:2;grid-row:1/4;display:flex;gap:12px;margin:0}

.hero .hb button.p{background:#86EFAC;border-color:#86EFAC;color:#04140C}
.hero .st{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px}
.hero .st div{background:#0B3322;border:1px solid #17543A;border-radius:20px;padding:18px 22px;text-align:left}
.hero .st b{font-size:36px;letter-spacing:-.5px}
.hero .st span{font-size:12px;letter-spacing:.08em;color:#8CC9A5;margin-top:4px}
.tabs{order:2;position:static;border:0;border-radius:22px;background:#06281A;padding:10px 12px;gap:6px;backdrop-filter:none}
.pill{background:transparent;border:0;color:#B7DBC4;font-size:16px;padding:10px 22px}
.pill:hover{background:#0F4A2E}
.pill.on{background:#15803D;color:#fff}
#main{order:3;display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:0 18px;align-items:start}

.card{margin:8px 0;padding:20px 22px;border-radius:22px;box-shadow:0 6px 18px rgba(20,67,43,.08)}
.ttl{font-size:23px}
.fl{padding:6px 0}
.fc{font-size:14.5px;padding:7px 16px;min-height:38px}
}
@media (min-width:1500px){.col{max-width:1680px}#main{grid-template-columns:repeat(auto-fill,minmax(500px,1fr))}}
</style>
